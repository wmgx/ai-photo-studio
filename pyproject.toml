[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-photo-studio"
version = "0.1.0"
description = "Local AI photo editing, versioned review, and album export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10"]

[project.scripts]
ai-photo-studio = "ai_photo_studio.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_photo_studio = ["web/*.html", "web/*.js", "web/*.css"]
